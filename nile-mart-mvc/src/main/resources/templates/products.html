
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nile-Mart - Products</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
        }

        h1 {
            color: #333;
        }

        nav {
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #333;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
    </style>
</head>

<body>

<h1>Available Products</h1>

<nav>
    <a th:href="@{/products}">Products</a> |
    <a th:href="@{/categories}">Categories</a> |
    <a th:href="@{/brands}">Brands</a> |
    <a th:href="@{/products/new}">Add Product</a>
</nav>

<table>
    <thead>
    <tr>
        <th>SKU</th>
        <th>Name</th>
        <th>Price</th>
        <th>Stock</th>
        <th>Category</th>
        <th>Brand</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="product : ${availableProducts}">
        <td th:text="${product.sku}"></td>
        <td th:text="${product.name}"></td>
        <td th:text="${product.price}"></td>
        <td th:text="${product.inStock}"></td>
        <td th:text="${productService.getCategoryName(product.category)}"></td>
        <td th:text="${productService.getBrandName(product.brandSlug)}"></td>
    </tr>
    </tbody>
</table>

</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Product - Nile Mart</title>
</head>
<body>

<h1>Add New Product</h1>

<nav>
    <a th:href="@{/products}">Products</a> |
    <a th:href="@{/categories}">Categories</a> |
    <a th:href="@{/brands}">Brands</a>
</nav>

<form th:action="@{/products}" th:object="${product}" method="post">

    <div>
        <label>SKU</label>
        <input type="text" th:field="*{sku}">
        <span th:if="${#fields.hasErrors('sku')}"
              th:errors="*{sku}"></span>
    </div>

    <div>
        <label>Name</label>
        <input type="text" th:field="*{name}">
        <span th:if="${#fields.hasErrors('name')}"
              th:errors="*{name}"></span>
    </div>

    <div>
        <label>Category</label>
        <select th:field="*{category}">
            <option value="">Select Category</option>
            <option th:each="category : ${subCategories}"
                    th:value="${category.slug}"
                    th:text="${category.name}">
            </option>
        </select>
        <span th:if="${#fields.hasErrors('category')}"
              th:errors="*{category}"></span>
    </div>

    <div>
        <label>Brand</label>
        <select th:field="*{brandSlug}">
            <option value="">No brand</option>
            <option th:each="brand : ${activeBrands}"
                    th:value="${brand.slug}"
                    th:text="${brand.name}">
            </option>
        </select>
        <span th:if="${#fields.hasErrors('brandSlug')}"
              th:errors="*{brandSlug}"></span>
    </div>

    <div>
        <label>Price</label>
        <input type="number" step="0.01" th:field="*{price}">
        <span th:if="${#fields.hasErrors('price')}"
              th:errors="*{price}"></span>
    </div>

    <div>
        <label>Stock</label>
        <input type="number" min="0" th:field="*{inStock}">
        <span th:if="${#fields.hasErrors('inStock')}"
              th:errors="*{inStock}"></span>
    </div>

    <button type="submit">Save Product</button>

</form>

<a th:href="@{/products}">Back to Products</a>

</body>
</html>
